{{ if site.Params.utteranc.enable }}
<div class="mt-3" id="js-comments">
	<p>Comments are powered by <a href="https://utteranc.es">utterances</a> and GitHub. Loading them sends your IP address to GitHub.</p>
	<button type="button" class="btn btn-main" id="js-comments-button">Show comments</button>
</div>
<script>
	document.getElementById('js-comments-button').addEventListener('click', function () {
		const container = document.getElementById('js-comments');
		const script = document.createElement('script');
		script.src = 'https://utteranc.es/client.js';
		script.setAttribute('repo', {{ site.Params.utteranc.repo }});
		script.setAttribute('issue-term', {{ site.Params.utteranc.issue_term }});
		script.setAttribute('label', {{ site.Params.utteranc.label }});
		script.setAttribute('theme', {{ site.Params.utteranc.theme }});
		script.setAttribute('crossorigin', {{ site.Params.utteranc.crossorigin | default "anonymous" }});
		script.async = true;
		container.replaceChildren(script);
	});
</script>
{{ end }}
